<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Bedrock Knowledge Base chat widget demo</title>
    <link
      rel="stylesheet"
      href="../packages/kb-chat-widget/dist/standalone/standalone.css"
    />
    <style>
      body {
        font-family: sans-serif;
        padding: 24px;
      }
      .demo-hint {
        font-size: 12px;
        color: #5f6b7a;
        margin: 0 0 16px;
      }
    </style>
  </head>
  <body>
    <h1>Bedrock Knowledge Base chat widget demo</h1>
    <p class="demo-hint">
      Backend: <code id="backend-url">(loading config…)</code> · Knowledge bases:
      <code id="kb-ids">…</code>
    </p>
    <p><button id="theme-toggle" type="button">Toggle dark mode</button></p>

    <div id="widget-target"></div>

    <script src="../packages/kb-chat-widget/dist/standalone/standalone.global.js"></script>
    <script>
      // Runtime config (endpoint + which knowledge bases to query) lives in config.json,
      // so the same built widget works across environments without editing code. The
      // widget itself never talks to AWS or knows about KB ids — it only calls the
      // customer's backend via fetchResponse, and the backend owns the Bedrock config.
      const DEFAULT_BACKEND_URL = 'http://localhost:3900/api/ask';

      fetch('./config.json')
        .then((res) => (res.ok ? res.json() : {}))
        .catch(() => ({}))
        .then((config) => {
          const backendUrl = config.backendUrl || DEFAULT_BACKEND_URL;
          const knowledgeBaseIds = Array.isArray(config.knowledgeBaseIds)
            ? config.knowledgeBaseIds
            : [];
          document.getElementById('backend-url').textContent = backendUrl;
          document.getElementById('kb-ids').textContent = knowledgeBaseIds.length
            ? knowledgeBaseIds.join(', ')
            : '(backend default)';

          // Sibling endpoint derived from the /api/ask base.
          const documentUrl = backendUrl.replace(/\/api\/ask$/, '/api/document');

          const logo =
            'data:image/svg+xml;utf8,' +
            encodeURIComponent(
              '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%230972d3"><circle cx="12" cy="12" r="10"/></svg>',
            );

          KBChatWidget.init({
            target: document.getElementById('widget-target'),
            theme: { primaryColor: '#0972d3' },
            title: 'Knowledge base assistant',
            logo: logo,
            onError: (err) => console.error('Widget error:', err),
            // The backend queries the knowledge bases configured here (from config.json).
            fetchResponse: (query) =>
              fetch(backendUrl, {
                method: 'POST',
                body: JSON.stringify({ query, knowledgeBaseIds }),
              }),
            resolveSource: (source) =>
              fetch(documentUrl, {
                method: 'POST',
                body: JSON.stringify(source),
              }).then((res) => res.json()),
          });

          // Dark mode: the host sets data-theme="dark" on the widget root; the widget's
          // CSS variables do the rest (it also auto-follows prefers-color-scheme).
          document.getElementById('theme-toggle').addEventListener('click', () => {
            const root = document.querySelector('.kbcw-root');
            if (!root) return;
            root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
          });
        });
    </script>
  </body>
</html>
